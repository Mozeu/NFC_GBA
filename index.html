<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>Mi emulador</title>
<style>
  html, body { margin:0; height:100%; background:#111; color:#fff; font-family:system-ui,sans-serif; }
  #game { width:100vw; height:100vh; }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:16px; padding:24px; text-align:center; background:#111; z-index:10; }
  .screen[hidden] { display:none; }
  button, input[type=file]::file-selector-button {
    background:#e53935; color:#fff; border:0; border-radius:10px; padding:14px 28px;
    font-size:18px; cursor:pointer; }
  p { margin:0; opacity:.8; }
</style>
</head>
<body>

<!-- Pantalla de mensajes / descarga / carga manual de ROM -->
<div id="setup" class="screen" hidden>
  <h2 id="msg"></h2>
  <p id="sub"></p>
  <input type="file" id="romfile" hidden>
</div>

<!-- Pantalla "Toca para continuar" (desbloquea audio y evita pantalla en blanco) -->
<div id="tap" class="screen" hidden>
  <h2 id="tapTitle"></h2>
  <button id="tapBtn">▶ Toca para continuar</button>
</div>

<div id="game"></div>

<script>
/* =====================  CONFIGURACIÓN  ===================== */
// Un juego por tag. El juego lo decide el TOKEN del tag, ya no el ?game= de la URL.
//  - Usa los MISMOS ids que en tu index.html actual: así se reutilizan las ROMs
//    y las partidas ya guardadas en el teléfono (si cambias un id, se vuelve a descargar).
//  - "hash" lo imprime tools/generar-tokens.mjs. Es seguro publicarlo.
const GAMES = {
  esmeralda: { core: "gba", title: "Pokémon Esmeralda",  hash: "f8d794244094a14ef5c593cfcf7b0224251f1e270acfadb94a9571869b08e246" },
  rojo:      { core: "gba", title: "Pokémon Rojo Fuego", hash: "ac8bfbf17a215f390cd36a13048ae2595648fbfaf802f02154da0d0ed11c71e9" },
};

// URL de tu Worker de Cloudflare, sin barra final.
// Si la dejas "" no se descarga nada y la ROM se carga a mano.
const ROM_SERVER = "https://roms.pokenfc.workers.dev";

const AUTOSAVE_MS = 60000;   // cada guardado serializa todo el estado: cuanto más espaciado, menos tirones
/* ========================================================== */

const $ = (id) => document.getElementById(id);

/* ---------- Opciones de la URL que siguen funcionando ---------- */
// Se leen ANTES de limpiar la barra de direcciones.
const Q = new URLSearchParams(location.search);   // ?fresh=1  ?lite=1  ?lite=0
try {
  if (Q.get("lite") === "1") localStorage.setItem("lite", "1");
  if (Q.get("lite") === "0") localStorage.removeItem("lite");
} catch (e) {}

/* ---------- IndexedDB mínimo ---------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open("roms", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("files");
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function kvGet(k) {
  const db = await dbp;
  return new Promise((res, rej) => {
    const q = db.transaction("files", "readonly").objectStore("files").get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
async function kvPut(k, v) {
  const db = await dbp;
  return new Promise((res, rej) => {
    const q = db.transaction("files", "readwrite").objectStore("files").put(v, k);
    q.onsuccess = () => res(); q.onerror = () => rej(q.error);
  });
}

/* ---------- Pantallas ---------- */
function showSetup(title, sub = "") {
  $("tap").hidden = true;
  $("setup").hidden = false;
  $("msg").textContent = title;
  $("sub").textContent = sub;
  $("romfile").hidden = true;
}

/* ---------- Token del tag ---------- */
// El tag trae  https://.../#t=TOKEN . Lo guardamos en sessionStorage (solo esta pestaña,
// así un refresco no obliga a escanear otra vez) y lo borramos de la barra de direcciones.
function takeToken() {
  const t = new URLSearchParams(location.hash.slice(1)).get("t");
  if (t) {
    try { sessionStorage.setItem("t", t); } catch (e) {}
    history.replaceState(null, "", location.pathname);   // quita #t=... y cualquier ?...
    return t;
  }
  try { return sessionStorage.getItem("t"); } catch (e) { return null; }
}

async function sha256hex(text) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(d), (b) => b.toString(16).padStart(2, "0")).join("");
}

// Devuelve el id del juego al que da acceso este token, o null.
async function gameForToken(token) {
  const h = await sha256hex(token);
  return Object.keys(GAMES).find((id) => GAMES[id].hash === h) || null;
}

/* ---------- Descarga remota ---------- */
// El Worker decide qué ROM devolver según el token; la ruta no cuenta.
async function downloadRom(token) {
  const r = await fetch(`${ROM_SERVER}/rom`, { headers: { Authorization: `Bearer ${token}` } });
  if (!r.ok) throw new Error("No se pudo descargar la ROM (" + r.status + ")");
  const blob = await r.blob();
  if (!blob.size) throw new Error("La ROM descargada está vacía");
  return blob;
}

/* ---------- Arrancar el emulador ---------- */
function start(id, rom, fresh) {
  const stateKey = "state:" + id;
  $("tap").hidden = true;
  $("setup").hidden = true;

  // Modo ligero: sin autoguardado periódico (solo al salir de la app).
  // ?lite=1 lo activa y lo recuerda en este teléfono; ?lite=0 lo desactiva.
  let lite = false;
  try { lite = localStorage.getItem("lite") === "1"; } catch (e) {}
  let timer = null, saving = false;

  async function autosave() {
    if (saving) return;              // evita guardados solapados
    saving = true;
    try {
      const s = EJS_emulator.gameManager.getState();
      if (s && s.length) await kvPut(stateKey, new Blob([s]));
    } catch (e) { /* el emulador aún no está listo */ }
    finally { saving = false; }
  }

  function schedule() {
    if (timer || lite) return;
    timer = setInterval(() => {
      if (document.hidden) return;   // si está en segundo plano, ya se guardó al ocultarse
      // Esperar un hueco libre para no pisar la emulación
      (window.requestIdleCallback || ((f) => setTimeout(f, 0)))(autosave, { timeout: 5000 });
    }, AUTOSAVE_MS);
  }

  function goLite() {
    lite = true;
    if (timer) { clearInterval(timer); timer = null; }
  }

  // Si el teléfono va por debajo de ~50 FPS, desactiva el autoguardado periódico
  // (solo durante esta sesión). Se mide tras 5 s para ignorar la carga inicial.
  function watchFps() {
    if (lite) return;
    let frames = 0, t0 = 0, aborted = false;
    const abort = () => { aborted = true; };
    document.addEventListener("visibilitychange", abort, { once: true });
    function tick(t) {
      if (aborted) return;           // la pestaña se ocultó: la medición no vale
      if (!t0) t0 = t;
      frames++;
      if (t - t0 < 6000) return requestAnimationFrame(tick);
      document.removeEventListener("visibilitychange", abort);
      if (frames / ((t - t0) / 1000) < 50) goLite();
    }
    requestAnimationFrame(tick);
  }

  window.EJS_player = "#game";
  window.EJS_core = GAMES[id].core;
  window.EJS_gameName = id;
  window.EJS_gameUrl = URL.createObjectURL(rom);
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_startOnLoaded = true;

  window.EJS_onGameStart = async () => {
    if (!fresh) {
      const saved = await kvGet(stateKey);
      if (saved) {
        const buf = new Uint8Array(await saved.arrayBuffer());
        setTimeout(() => { try { EJS_emulator.gameManager.loadState(buf); } catch (e) {} }, 800);
      }
    }
    schedule();
    setTimeout(watchFps, 5000);
    document.addEventListener("visibilitychange", () => { if (document.hidden) autosave(); });
    window.addEventListener("pagehide", autosave);
  };

  const s = document.createElement("script");
  s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
  document.body.appendChild(s);
}

/* ---------- Lógica principal ---------- */
(async () => {
  const fresh = Q.get("fresh") === "1";   // ?fresh=1 ignora el autoguardado

  // Antes de tocar la URL: ¿están pegados los hashes?
  if (!Object.values(GAMES).every((g) => /^[0-9a-f]{64}$/.test(g.hash))) {
    return showSetup("Falta configurar", "Pega los hashes de tools/generar-tokens.mjs en GAMES.");
  }

  const token = takeToken();
  if (!token) return showSetup("Acerca el teléfono a un tag NFC", "Cada tag abre su propio juego.");

  const id = await gameForToken(token);
  if (!id) {
    try { sessionStorage.removeItem("t"); } catch (e) {}
    return showSetup("Tag no reconocido", "Si es un tag antiguo, reescríbelo con la URL nueva.");
  }

  let rom = await kvGet(id);

  // Descarga remota (solo la primera vez en cada teléfono)
  if (!rom && ROM_SERVER) {
    showSetup(`Descargando ${GAMES[id].title}...`, "Solo la primera vez");
    try { rom = await downloadRom(token); await kvPut(id, rom); }
    catch (e) { return showSetup("Error", e.message); }
  }

  // Carga manual (solo si no hay servidor configurado)
  if (!rom) {
    showSetup(`Carga tu ROM de ${GAMES[id].title}`, "Solo la primera vez");
    const input = $("romfile");
    input.hidden = false;
    input.onchange = async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      $("sub").textContent = `Guardando ${f.name}...`;
      try {
        // Copiamos los bytes a memoria: en móvil, guardar el File directo
        // puede fallar porque solo es una referencia al archivo del sistema.
        const buf = await f.arrayBuffer();
        if (!buf.byteLength) throw new Error("El archivo está vacío o no se pudo leer");
        await kvPut(id, new Blob([buf]));
        const check = await kvGet(id);
        if (!check || !check.size) throw new Error("No se pudo guardar en el navegador");
        input.hidden = true;
        showTap(id, check, fresh);   // sin recargar la página
      } catch (err) {
        $("sub").textContent = "Error: " + err.message;
        input.value = "";
      }
    };
    return;
  }

  showTap(id, rom, fresh);
})();

// ROM lista: pedir un toque para arrancar (evita pantalla en blanco)
function showTap(id, rom, fresh) {
  $("setup").hidden = true;
  $("tapTitle").textContent = GAMES[id].title;
  $("tap").hidden = false;
  $("tapBtn").onclick = () => start(id, rom, fresh);
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
