<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://cdn.emulatorjs.org" crossorigin>
<title>Mi emulador</title>
<style>
  html, body { margin:0; height:100%; background:#111; color:#fff; font-family:system-ui,sans-serif; }
  #game { width:100vw; height:100vh; height:100dvh;}
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:16px; padding:24px; text-align:center; background:#111; z-index:10; }
  .screen[hidden] { display:none; }
  button, input[type=file]::file-selector-button {
    background:#e53935; color:#fff; border:0; border-radius:10px; padding:14px 28px;
    font-size:18px; cursor:pointer; }
  p { margin:0; opacity:.8; }
</style>
</head>
<body>

<!-- Pantalla de mensajes / descarga / carga manual de ROM -->
<div id="setup" class="screen" hidden>
  <h2 id="msg"></h2>
  <p id="sub"></p>
  <input type="file" id="romfile" hidden>
</div>

<!-- Pantalla "Toca para continuar" (desbloquea audio y evita pantalla en blanco) -->
<div id="tap" class="screen" hidden>
  <h2 id="tapTitle"></h2>
  <button id="tapBtn">▶ Toca para continuar</button>
</div>

<div id="game"></div>

<script>
/* =====================  CONFIGURACIÓN  ===================== */
// Un juego por tag. El juego lo decide el TOKEN del tag, no la URL.
//  - "hash" lo imprime tools/generar-tokens.mjs. Es seguro publicarlo.
//  - Usa los mismos ids de siempre para conservar ROMs y partidas ya guardadas.
const GAMES = {
  esmeralda: { core: "gba", title: "Pokémon Esmeralda",  hash: "f8d794244094a14ef5c593cfcf7b0224251f1e270acfadb94a9571869b08e246" },
  rojo:      { core: "gba", title: "Pokémon Rojo Fuego", hash: "ac8bfbf17a215f390cd36a13048ae2595648fbfaf802f02154da0d0ed11c71e9" },
};

// URL de tu Worker de Cloudflare, sin barra final.
// Si la dejas "" no se descarga nada y la ROM se carga a mano.
const ROM_SERVER = "https://roms.pokenfc.workers.dev";

// Versión FIJA de EmulatorJS (no "stable"): la caché guarda archivos de una sola versión
// y no se mezclan si EmulatorJS publica una nueva. Si algún día la cambias, sube también
// el número de CACHE en sw.js.
const EJS_DATA = "https://cdn.emulatorjs.org/4.2.3/data/";

// Núcleo de EmulatorJS por sistema, para precargarlo la primera vez. Si un sistema no
// está aquí no pasa nada: su núcleo se descarga y guarda al jugar por primera vez.
const CORE_FILES = { gba: "mgba" };
/* ========================================================== */

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Se lee ANTES de limpiar la barra de direcciones. ?fresh=1 empieza sin reanudar.
const Q = new URLSearchParams(location.search);

/* ---------- Service worker ---------- */
// Se registra al principio y se espera a que esté activo antes de descargar,
// para que lo descargado quede guardado en su caché.
const swReady = ("serviceWorker" in navigator)
  ? Promise.race([
      navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready),
      sleep(4000),
    ]).catch(() => {})
  : Promise.resolve();

/* ---------- IndexedDB mínimo ---------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open("roms", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("files");
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function kvGet(k) {
  const db = await dbp;
  return new Promise((res, rej) => {
    const q = db.transaction("files", "readonly").objectStore("files").get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
async function kvPut(k, v) {
  const db = await dbp;
  return new Promise((res, rej) => {
    const q = db.transaction("files", "readwrite").objectStore("files").put(v, k);
    q.onsuccess = () => res(); q.onerror = () => rej(q.error);
  });
}

/* ---------- Pantallas ---------- */
function showSetup(title, sub = "") {
  $("tap").hidden = true;
  $("setup").hidden = false;
  $("msg").textContent = title;
  $("sub").textContent = sub;
  $("romfile").hidden = true;
}

/* ---------- Token del tag ---------- */
// El tag trae  https://.../#t=TOKEN . Lo guardamos en sessionStorage (solo esta pestaña,
// así un refresco no obliga a escanear otra vez) y lo borramos de la barra de direcciones.
function takeToken() {
  const t = new URLSearchParams(location.hash.slice(1)).get("t");
  if (t) {
    try { sessionStorage.setItem("t", t); } catch (e) {}
    history.replaceState(null, "", location.pathname);   // quita #t=... y cualquier ?...
    return t;
  }
  try { return sessionStorage.getItem("t"); } catch (e) { return null; }
}

async function sha256hex(text) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(d), (b) => b.toString(16).padStart(2, "0")).join("");
}

// Devuelve el id del juego al que da acceso este token, o null.
async function gameForToken(token) {
  const h = await sha256hex(token);
  return Object.keys(GAMES).find((id) => GAMES[id].hash === h) || null;
}

/* ---------- Descargas de la primera vez ---------- */
// El Worker decide qué ROM devolver según el token; la ruta no cuenta.
async function downloadRom(token) {
  const r = await fetch(`${ROM_SERVER}/rom`, { headers: { Authorization: `Bearer ${token}` } });
  if (!r.ok) throw new Error("No se pudo descargar la ROM (" + r.status + ")");
  const blob = await r.blob();
  if (!blob.size) throw new Error("La ROM descargada está vacía");
  return blob;
}

// ¿Ya tiene el teléfono guardado el emulador? Sin Cache API no se puede guardar nada.
async function emulatorCached() {
  if (!("caches" in window)) return true;
  try { return !!(await caches.match(EJS_DATA + "emulator.min.js")); } catch (e) { return true; }
}

// Pide por adelantado los archivos del emulador. El service worker los guarda, y las
// siguientes veces cargan desde el teléfono, sin red. Nunca falla: lo que no llegue
// aquí se guardará al jugar.
async function warmup(id) {
  await swReady;
  const core = CORE_FILES[GAMES[id].core];
  const files = ["loader.js", "emulator.min.js", "emulator.min.css"];
  if (core) files.push(`cores/reports/${core}.json`, `cores/${core}-wasm.data`);
  await Promise.all(files.map((f) =>
    fetch(EJS_DATA + f).then((r) => (r.ok ? r.arrayBuffer() : null)).catch(() => null)
  ));
}

/* ---------- Arrancar el emulador ---------- */
// Sin autoguardado periódico: guardar el estado en pleno juego congela unos milisegundos.
// Se guarda UNA vez, cuando sales de la app o cambias de pestaña (y no hay nadie jugando).
function start(id, rom, state) {
  $("tap").hidden = true;
  $("setup").hidden = true;

  const stateKey = "state:" + id;
  let started = false, saving = false;

  async function save() {
    if (!started || saving) return;   // antes de arrancar no hay nada que guardar
    saving = true;
    try {
      const s = EJS_emulator.gameManager.getState();
      if (s && s.length) await kvPut(stateKey, new Blob([s]));
    } catch (e) { /* el emulador no está listo */ }
    finally { saving = false; }
  }

  window.EJS_player = "#game";
  window.EJS_core = GAMES[id].core;
  window.EJS_gameName = id;
  window.EJS_gameUrl = URL.createObjectURL(rom);
  // El estado se lee antes de arrancar y EmulatorJS lo aplica solo al empezar.
  window.EJS_loadStateURL = state && state.size ? URL.createObjectURL(state) : "";
  window.EJS_pathtodata = EJS_DATA;
  window.EJS_startOnLoaded = true;
  window.EJS_onGameStart = () => { started = true; };

  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
  window.addEventListener("pagehide", save);

  const s = document.createElement("script");
  s.src = EJS_DATA + "loader.js";
  document.body.appendChild(s);
}

// ROM lista: pedir un toque para arrancar (evita pantalla en blanco por autoplay).
// Mientras tanto se lee el estado guardado, para no hacerlo con el juego ya en marcha.
async function ready(id, rom, fresh) {
  let state = null;
  if (!fresh) { try { state = await kvGet("state:" + id); } catch (e) {} }
  $("setup").hidden = true;
  $("tapTitle").textContent = GAMES[id].title;
  $("tap").hidden = false;
  $("tapBtn").onclick = () => start(id, rom, state);
}

/* ---------- Lógica principal ---------- */
(async () => {
  const fresh = Q.get("fresh") === "1";

  // Antes de tocar la URL: ¿están pegados los hashes?
  if (!Object.values(GAMES).every((g) => /^[0-9a-f]{64}$/.test(g.hash))) {
    return showSetup("Falta configurar", "Pega los hashes de tools/generar-tokens.mjs en GAMES.");
  }

  const token = takeToken();
  if (!token) return showSetup("Acerca el teléfono a un tag NFC", "Cada tag abre su propio juego.");

  const id = await gameForToken(token);
  if (!id) {
    try { sessionStorage.removeItem("t"); } catch (e) {}
    return showSetup("Tag no reconocido", "Si es un tag antiguo, reescríbelo con la URL nueva.");
  }

  // Que el navegador no borre ROMs, partidas ni caché cuando falte espacio.
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

  let rom = await kvGet(id);
  const needEmulator = !(await emulatorCached());

  if (!rom && ROM_SERVER) {
    // Primera vez en este teléfono: ROM y emulador se descargan a la vez.
    showSetup(`Descargando ${GAMES[id].title}...`, "Solo la primera vez: juego y emulador");
    try {
      const [r] = await Promise.all([downloadRom(token), needEmulator ? warmup(id) : null]);
      rom = r;
      await kvPut(id, rom);
    } catch (e) { return showSetup("Error", e.message); }
  } else if (needEmulator) {
    showSetup("Preparando el emulador...", "Solo la primera vez");
    await warmup(id);
  }

  // Carga manual (solo si no hay servidor configurado)
  if (!rom) {
    showSetup(`Carga tu ROM de ${GAMES[id].title}`, "Solo la primera vez");
    const input = $("romfile");
    input.hidden = false;
    input.onchange = async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      $("sub").textContent = `Guardando ${f.name}...`;
      try {
        // Copiamos los bytes a memoria: en móvil, guardar el File directo
        // puede fallar porque solo es una referencia al archivo del sistema.
        const buf = await f.arrayBuffer();
        if (!buf.byteLength) throw new Error("El archivo está vacío o no se pudo leer");
        await kvPut(id, new Blob([buf]));
        const check = await kvGet(id);
        if (!check || !check.size) throw new Error("No se pudo guardar en el navegador");
        input.hidden = true;
        ready(id, check, fresh);   // sin recargar la página
      } catch (err) {
        $("sub").textContent = "Error: " + err.message;
        input.value = "";
      }
    };
    return;
  }

  ready(id, rom, fresh);
})();
</script>
</body>
</html>
